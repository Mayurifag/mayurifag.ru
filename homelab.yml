---
- name: Home LAN router
  hosts: homelab_routers
  gather_facts: no
  become: no
  roles:
    - role: homelab_dns
      tags: homelab_dns
      vars:
        homelab_dns_endpoint: router

- name: Proxmox homelab
  hosts: homelab
  gather_facts: yes
  become: no
  roles:
    - role: homelab_dns
      tags: homelab_dns
      vars:
        homelab_dns_endpoint: host
    - role: homelab_access
      tags: homelab_access
      when: homelab_access_enabled | default(false) | bool
    - role: homelab_host
      tags: homelab_host
      when: homelab_host_enabled | default(false) | bool
    - role: homelab_proxy
      tags: homelab_proxy
      when: homelab_proxy_enabled | default(false) | bool
    - role: beszel_agent
      tags:
        - beszel
        - beszel_agent
      when: beszel_agent_enabled | default(false) | bool
  tasks:
    - name: Extend the existing VM pool after explicitly confirmed storage maintenance
      ansible.builtin.include_role:
        name: homelab_host
        tasks_from: storage-grow
        apply:
          tags: homelab_storage_grow
      tags:
        - never
        - homelab_storage_grow

    - name: Gracefully stop guests for explicitly confirmed maintenance
      ansible.builtin.include_role:
        name: homelab_host
        tasks_from: maintenance-stop
        apply:
          tags: homelab_maintenance_stop
      tags:
        - never
        - homelab_maintenance_stop

    - name: Reboot and verify the homelab
      ansible.builtin.include_role:
        name: homelab_host
        tasks_from: reboot
        apply:
          tags: homelab_reboot
      tags:
        - never
        - homelab_reboot

- name: Homelab Immich guest
  hosts: homelab_immich
  gather_facts: yes
  become: yes
  roles:
    - role: homelab_dns
      tags: homelab_dns
      vars:
        homelab_dns_endpoint: guest
    - role: immich
      tags: immich
      when: immich_enabled | default(false) | bool

- name: Home Assistant SSH app
  hosts: homelab_home_assistant
  gather_facts: no
  become: no
  roles:
    - role: home_assistant
      tags: home_assistant
      when: home_assistant_enabled | default(false) | bool
  tasks:
    - name: Reboot only the Home Assistant guest
      ansible.builtin.reboot:
        reboot_command: ha host reboot
        boot_time_command: cat /proc/sys/kernel/random/boot_id
        reboot_timeout: 300
        post_reboot_delay: 10
      tags:
        - never
        - home_assistant_reboot

    - name: Wait for Home Assistant after the guest reboot
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:80/manifest.json"
        use_proxy: false
        status_code: 200
      register: home_assistant_reboot_health
      until: home_assistant_reboot_health.status == 200
      retries: 60
      delay: 2
      tags:
        - never
        - home_assistant_reboot
