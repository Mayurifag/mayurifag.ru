            time: "08:00:00"
        - wait_template: >-
            {{ is_state('switch.kabinet_rozetka', 'on')
                and '07:59:55' <= states('time.kabinet_rozetka_taimer') <= '08:00:00' }}
          timeout: "00:00:05"
        - if: "{{ not wait.completed }}"
          then:
            - action: switch.turn_off
              target:
                entity_id: switch.kabinet_rozetka
            - stop: Failed to arm the cabinet plug countdown; switched the plug off.
              error: true
      else:
        - action: switch.turn_off
          target:
            entity_id: switch.kabinet_rozetka
        - action: time.set_value
