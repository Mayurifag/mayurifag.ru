---
- name: Provisioning
  hosts: sample
  gather_facts: yes
  become: yes
  pre_tasks:
    - name: "TARGET SERVER"
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "  Inventory host : {{ inventory_hostname }}"
          - "  server_hostname: {{ server_hostname }}"
          - "  ansible_host   : {{ ansible_host }}"
          - "================================================"
      tags: always
  roles:
    - role: general
      tags:
        - general

    - role: ssh
      tags:
        - ssh

    - role: debian13
      tags:
        - never
        - debian13

    - role: home
      tags:
        - home

    - role: mise
      tags:
        - mise
      when: (mise_enabled | default(False))

    - role: geerlingguy.docker
      tags:
        - docker
      when: (docker_enabled | default(False))

    - role: traefik
      tags:
        - traefik
      when: (traefik_enabled | default(False))

    - role: lldap
      tags:
        - lldap
      when: (lldap_enabled | default(False))

    - role: tinyauth
      tags:
        - tinyauth
      when: (tinyauth_enabled | default(False))

    - role: mayurifag_github_io
      tags:
        - mayurifag_github_io
      when: (mayurifag_github_io_enabled | default(False))

    - role: threexui
      tags:
        - threexui
      when: (threexui_enabled | default(False))

    - role: portainer
      tags:
        - portainer
      when: (portainer_enabled | default(False))

    - role: beszel_hub
      tags:
        - beszel
        - beszel_hub
      when: (beszel_hub_enabled | default(False) | bool)

    - role: beszel_agent
      tags:
        - beszel
        - beszel_agent
      when: (beszel_agent_enabled | default(False) | bool)

    - role: mus
      tags:
        - mus
      when: (mus_enabled | default(False))

    - role: navidrome
      tags:
        - navidrome
      when: (navidrome_enabled | default(False))

    - role: opencloud
      tags:
        - opencloud
      when: (opencloud_enabled | default(False))

    - role: bentopdf
      tags:
        - bentopdf
      when: (bentopdf_enabled | default(False))

    - role: convertx
      tags:
        - convertx
      when: (convertx_enabled | default(False))

    - role: snapotter
      tags:
        - snapotter
      when: (snapotter_enabled | default(False))

    - role: echoip
      tags:
        - echoip
      when: (echoip_enabled | default(False))

    - role: qr
      tags:
        - qr
      when: (qr_enabled | default(False))

    - role: watchtower
      tags:
        - watchtower
      when: (watchtower_enabled | default(False))

    - role: tg_ai_manager
      tags:
        - tg_ai_manager
      when: (tg_ai_manager_enabled | default(False))

    - role: dynacat
      tags:
        - dynacat
      when: (dynacat_enabled | default(False))

  post_tasks:
    - name: Post-install cheatsheet
      ansible.builtin.debug:
        msg: "{{ post_install_messages }}"
      when: (post_install_messages | default([])) | length > 0
      tags: always
