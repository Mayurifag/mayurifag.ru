---
ansible_user: root
ansible_become: false
ansible_port: 2222
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: >-
  -o RemoteCommand=none
  -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ inventory_dir }}/files/homelab_known_hosts
  -o ProxyCommand="netbird ssh --no-browser root@100.64.0.10 nc %h %p"
home_assistant_enabled: true
home_assistant_xiaomi_miot_enabled: true
home_assistant_vacuum_map_source: ""
