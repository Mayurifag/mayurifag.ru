---
- name: Require explicit downtime confirmation
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'HOMELAB_MAINTENANCE_CONFIRM') == 'stop-guests'

- name: Read guest states in reverse startup declaration order
  ansible.builtin.command: "qm status {{ item.id | int }}"
  loop: "{{ homelab_host_vms | reverse | list }}"
  loop_control:
    label: "{{ item.id }} {{ item.name }}"
  changed_when: false
  register: homelab_host_maintenance_initial

- name: Require known running or stopped guest states
  ansible.builtin.assert:
    that:
      - "item.stdout in ['status: running', 'status: stopped']"
  loop: "{{ homelab_host_maintenance_initial.results }}"
  loop_control:
    label: "{{ item.item.id }} {{ item.item.name }}"

- name: Shut down running guests without force-stop
  ansible.builtin.command:
    argv:
      - qm
      - shutdown
      - "{{ item.item.id | int }}"
      - --timeout
      - "180"
      - --forceStop
      - "0"
  loop: "{{ homelab_host_maintenance_initial.results }}"
  loop_control:
    label: "{{ item.item.id }} {{ item.item.name }}"
  when: "item.stdout == 'status: running'"
  changed_when: true

- name: Verify every declared guest is stopped
  ansible.builtin.command: "qm status {{ item.id | int }}"
  loop: "{{ homelab_host_vms | reverse | list }}"
  loop_control:
    label: "{{ item.id }} {{ item.name }}"
  changed_when: false
  register: homelab_host_maintenance_status
  failed_when: "homelab_host_maintenance_status.stdout != 'status: stopped'"
