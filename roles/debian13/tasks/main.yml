---
- name: Ensure host is Debian 12 or 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version in ["12", "13"]
    fail_msg: "This role only upgrades Debian 12 to Debian 13."

- name: Upgrade Debian 12 to Debian 13
  when: ansible_facts.distribution_major_version == "12"
  environment:
    DEBIAN_FRONTEND: noninteractive
  block:
    - name: Upgrade current release packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        dpkg_options: force-confdef,force-confold
        force_apt_get: yes
        lock_timeout: 300

    - name: Find apt source files pinned to bookworm
      ansible.builtin.find:
        paths: /etc/apt
        recurse: yes
        file_type: file
        patterns:
          - "*.list"
          - "*.sources"
        contains: .*bookworm.*
      register: debian13_apt_sources

    - name: Switch apt sources to trixie
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: bookworm
        replace: trixie
      loop: "{{ debian13_apt_sources.files }}"

    - name: Upgrade to Debian 13
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        dpkg_options: force-confdef,force-confold
        force_apt_get: yes
        lock_timeout: 300

    - name: Reboot into Debian 13
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after Debian 13 upgrade"
        connect_timeout: 5
        reboot_timeout: 900
        post_reboot_delay: 30
        test_command: uptime

    - name: Refresh facts after reboot
      ansible.builtin.setup:

- name: Ensure host is now Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution_major_version == "13"
    fail_msg: "Debian 13 upgrade did not complete."
