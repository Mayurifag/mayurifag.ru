---
- name: Create OpenCloud Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"
  with_items:
    - "{{ opencloud_data_directory }}/config"
    - "{{ opencloud_data_directory }}/var"
    - "{{ opencloud_files_directory }}"

- name: Remove Old OpenCloud NATS Directory
  ansible.builtin.file:
    path: "{{ opencloud_data_directory }}/nats"
    state: absent

- name: Remove Old OpenCloud NATS Config
  ansible.builtin.file:
    path: "{{ opencloud_data_directory }}/nats.conf"
    state: absent

- name: Configure OpenCloud Traefik Transport (Timeouts)
  ansible.builtin.template:
    src: traefik_opencloud.toml.j2
    dest: "{{ traefik_dynamic_configs_directory }}/opencloud.toml"
    mode: "0644"

- name: Check OpenCloud Config Against Image
  block:
    - name: Create OpenCloud Config Diff Directory
      ansible.builtin.tempfile:
        state: directory
        suffix: opencloud-config
      register: opencloud_config_diff_directory

    - name: Set OpenCloud Config Diff Directory Permissions
      ansible.builtin.file:
        path: "{{ opencloud_config_diff_directory.path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Copy OpenCloud Config For Diff
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/files/opencloud.yaml"
        dest: "{{ opencloud_config_diff_directory.path }}/opencloud.yaml"
        owner: "1000"
        group: "1000"
        mode: "0600"

    - name: Run OpenCloud Config Init Diff
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --pull
          - always
          - --entrypoint
          - opencloud
          - -v
          - "{{ opencloud_config_diff_directory.path }}:/etc/opencloud"
          - "{{ opencloud_image }}"
          - init
          - --diff
          - --insecure
          - "true"
      register: opencloud_config_init_diff
      changed_when: false
  always:
    - name: Remove OpenCloud Config Diff Directory
      ansible.builtin.file:
        path: "{{ opencloud_config_diff_directory.path }}"
        state: absent
      when: opencloud_config_diff_directory is defined and opencloud_config_diff_directory.path is defined

- name: Fail If OpenCloud Config Diff Exists
  ansible.builtin.fail:
    msg: |-
      OpenCloud inventory config is not fully compliant with {{ opencloud_image }}.
      Apply the full opencloud init --diff output to {{ inventory_dir }}/files/opencloud.yaml before deploying.
      {{ opencloud_config_init_diff.stdout }}
      {{ opencloud_config_init_diff.stderr }}
  when: "'no changes, your config is up to date' not in opencloud_config_init_diff.stdout"

- name: Remove opencloud container
  community.docker.docker_container:
    name: opencloud
    state: absent

- name: Reset OpenCloud State
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ opencloud_reset_state_paths }}"
  when: opencloud_reset_state | bool

- name: Configure OpenCloud Config
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/files/opencloud.yaml"
    dest: "{{ opencloud_data_directory }}/config/opencloud.yaml"
    owner: "1000"
    group: "1000"
    mode: "0600"

- name: OpenCloud Docker Container
  community.docker.docker_container:
    name: opencloud
    image: "{{ opencloud_image }}"
    pull: false
    recreate: true
    restart_policy: unless-stopped
    command: server
    volumes:
      - "{{ opencloud_data_directory }}/config:/etc/opencloud"
      - "{{ opencloud_data_directory }}/var:/var/lib/opencloud"
      - "{{ opencloud_files_directory }}:/storage"
    env:
      OC_DOMAIN: "{{ opencloud_subdomain }}.{{ server_hostname }}"
      OC_URL: "https://{{ opencloud_subdomain }}.{{ server_hostname }}"
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      PROXY_HTTPS_ADDR: ""
      PROXY_TLS: "false" # Traefik handles TLS
      OC_INSECURE: "true"
      OC_LOG_LEVEL: "warn"
      LOG_PRETTY: "false"
      MICRO_REGISTRY: "nats-js-kv"
      # Disable Open Cloud Mesh (federation between OpenCloud servers).
      # Not used here; service spams "missing or incomplete nats configuration"
      # Refs: https://github.com/owncloud/ocis/issues/8921
      #       https://github.com/opencloud-eu/opencloud/issues/1591
      OC_EXCLUDE_RUN_SERVICES: "ocm"
      FRONTEND_CHECK_FOR_UPDATES: "false"
      OC_DISABLE_VERSIONING: "true"
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "false"
      IDP_ACCESS_TOKEN_EXPIRATION: "2592000"
      IDP_ID_TOKEN_EXPIRATION: "2592000"
      IDP_REFRESH_TOKEN_EXPIRATION: "30240000"
      # Keep storage-system warnings visible; they can indicate metadata/NATS trouble.
      STORAGE_SYSTEM_LOG_LEVEL: "warn"

      STORAGE_USERS_DRIVER: "posix"
      # NATS-KV mandatory for posix collaborative mode (WATCH_FS=true).
      # Memory store not supported: watcher + storage-users must share inode->UUID map.
      # Only reset persisted NATS data deliberately with opencloud_reset_state.
      # Docs: https://docs.opencloud.eu/docs/admin/configuration/storage/storage-posix
      STORAGE_USERS_ID_CACHE_STORE: "nats-js-kv"
      STORAGE_USERS_POSIX_PROPAGATOR: "sync"
      # Other services write directly into /storage, so OpenCloud must watch the filesystem.
      STORAGE_USERS_POSIX_WATCH_FS: "true"
      STORAGE_USERS_POSIX_ROOT: "/storage"
      # Reduce inotify→NATS event rate to ease JetStream pressure (default: 1s)
      STORAGE_USERS_POSIX_SCAN_DEBOUNCE_DELAY: "5s"
      STORAGE_USERS_POSIX_INOTIFY_STATS_FREQUENCY: "0s"

      OC_LDAP_URI: "ldap://lldap:3890"
      OC_LDAP_BIND_DN: "uid=observer,ou=people,{{ lldap_base_dn }}"
      OC_LDAP_BIND_PASSWORD: "{{ lldap_observer_user_password }}"
      OC_LDAP_USER_BASE_DN: "ou=people,{{ lldap_base_dn }}"
      OC_LDAP_GROUP_BASE_DN: "ou=groups,{{ lldap_base_dn }}"
      OC_LDAP_INSECURE: "true"
      OC_LDAP_LOGIN_ATTRIBUTES: "uid,mail"
      OC_LDAP_USER_SCHEMA_ID: "uid"
      OC_LDAP_DISABLE_USER_MECHANISM: "none"
      OC_LDAP_SERVER_WRITE_ENABLED: "false"
      GRAPH_LDAP_SERVER_UUID: "true"
      GRAPH_LDAP_SERVER_USE_PASSWORD_MODIFY_EXOP: "false"
    networks:
      - name: "web"
    labels:
      traefik.enable: "true"
      traefik.http.routers.opencloud.rule: "Host(`{{ opencloud_subdomain }}.{{ server_hostname }}`)"
      traefik.http.services.opencloud.loadbalancer.server.port: "9200"

      traefik.http.services.opencloud.loadbalancer.serverstransport: "opencloud-transport@file"

      # WebDAV Service Discovery (CalDAV/CardDAV)
      # Redirects /.well-known/(cal|card)dav to /remote.php/dav/
      traefik.http.middlewares.opencloud-dav.redirectregex.regex: "^https?://([^/]+)/\\.well-known/(card|cal)dav"
      traefik.http.middlewares.opencloud-dav.redirectregex.replacement: "https://$1/remote.php/dav/"
      traefik.http.middlewares.opencloud-dav.redirectregex.permanent: "true"

      traefik.http.routers.opencloud.middlewares: "opencloud-dav"
