---
dynacat_enabled: true
dynacat_subdomain: "rss"
dynacat_image: "panonim/dynacat:latest"
dynacat_memory: "256m"
dynacat_data_directory: "{{ docker_home }}/dynacat"

# Get a GitHub token at https://github.com/settings/tokens (no scopes needed for public repos)
dynacat_github_token: "change_this_github_token"

# Get a GitHub token with notifications scope for github-notifications widget
dynacat_github_notifications_token: "change_this_github_notifications_token"

# City name — coords resolved via Open-Meteo geocoding at deploy time. "City, Country" format works.
dynacat_location_name: "Moscow, Russia"

# Get a free Finnhub token at https://finnhub.io/register (60 req/min free tier)
dynacat_finnhub_token: "change_this_finnhub_token"

dynacat_twitch_channels:
  - SilverName
  - HoneyMad

dynacat_markets:
  - symbol: "ES=F"
    name: "S&P 500"
  - symbol: "NQ=F"
    name: "QQQ"

# Tech YouTube channel IDs
dynacat_tech_youtube_channels:
  - UCBJycsmduvYEL83R_U4JriQ
  - UC4e_XPBiiIO4fo4_CucxQeg

# Optional widget lists — set to [] to hide widget
dynacat_github_releases_repos: []
dynacat_reddit_subreddits: []
