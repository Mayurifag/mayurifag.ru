---
sysctl_values_absent:
  - net.ipv4.tcp_tw_recycle

sysctl_values:
  # 438 = log-level + keyboard + sync + remount-ro + reboot + RT-nice.
  # Excludes 8 (debug dumps) and 64 (kill arbitrary procs). Keeps emergency
  # Alt+SysRq lifeline (S/U/B) when kernel wedged. 0 = fully disabled, but VPS
  # has no physical console so attack surface ~= /proc/sysrq-trigger which
  # already needs root.
  - { key: kernel.sysrq, value: 438 }

  - { key: vm.vfs_cache_pressure, value: 100 }

  # Prevent against the common 'syn flood attack'
  - { key: net.ipv4.tcp_syncookies, value: 1 }

  # - { key: kernel.msgmnb, value: 65536 }
  # - { key: kernel.msgmax, value: 65536 }
  # - { key: kernel.shmmax, value: 68719476736 }
  # - { key: kernel.shmall, value: 4294967296 }
  - { key: kernel.core_uses_pid, value: 1 }
  - { key: net.ipv4.conf.all.accept_source_route, value: 0 }
  - { key: net.ipv4.conf.default.accept_source_route, value: 0 }

  # Do not accept ICMP redirects (prevent MITM attacks)
  - { key: net.ipv4.conf.all.accept_redirects, value: 0 }
  - { key: net.ipv6.conf.all.accept_redirects, value: 0 }
  - { key: net.ipv4.conf.default.accept_redirects, value: 0 }
  - { key: net.ipv6.conf.default.accept_redirects, value: 0 }
  - { key: net.ipv4.conf.all.send_redirects, value: 0 }
  - { key: net.ipv4.conf.default.send_redirects, value: 0 }
  - { key: net.ipv4.conf.default.secure_redirects, value: 0 }
  - { key: net.ipv4.route.flush, value: 1 }
  - { key: net.ipv6.route.flush, value: 1 }

  # rp_filter=2 (loose mode): drop packets only if source unreachable via ANY
  # interface. Handles asymmetric routing (VPN, multi-homed) without disabling
  # spoof protection. Mode 0 was old workaround, 2 is the modern equivalent.
  - { key: net.ipv4.conf.all.log_martians, value: 1 }
  - { key: net.ipv4.conf.default.log_martians, value: 1 }
  - { key: net.ipv4.conf.all.rp_filter, value: 2 }
  - { key: net.ipv4.conf.default.rp_filter, value: 2 }

  # Avoid a smurf attack
  - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: 1 }

  # Turn on protection for bad icmp error messages
  - { key: net.ipv4.icmp_ignore_bogus_error_responses, value: 1 }
  - { key: net.ipv4.conf.all.secure_redirects, value: 0 }
  # Full ASLR (stack, heap, mmap, vdso, shared libs). Distro default already 2;
  # keep explicit so a tampered host gets reverted.
  - { key: kernel.randomize_va_space, value: 2 }
  # Raised from 12MB to 16MB to match modern distro defaults and unlock full
  # tcp_rmem/tcp_wmem max. Pairs with HTTP/3 (QUIC) buffer needs.
  - { key: net.core.wmem_max, value: 16777216 }
  - { key: net.core.rmem_max, value: 16777216 }
  - { key: fs.suid_dumpable, value: 0 }
  - { key: fs.protected_hardlinks, value: 1 }
  - { key: fs.protected_symlinks, value: 1 }
  - { key: fs.file-max, value: 2097152 }

  # ss optimizations
  - { key: net.ipv4.tcp_fastopen, value: 3 }
  - { key: net.ipv4.tcp_tw_reuse, value: 1 }
  # from ss-rust further optimizations (tcp-bbr)
  - { key: net.core.default_qdisc, value: fq }
  - { key: net.ipv4.tcp_congestion_control, value: bbr }
  # Don't reset cwnd on idle connections. BBR re-probes bandwidth quickly anyway,
  # and HTTP keep-alive / WebSocket benefit from preserved cwnd after pauses.
  - { key: net.ipv4.tcp_slow_start_after_idle, value: 0 }
  # Per-CPU packet backlog. Default 1000 too small for 1Gbps+ NICs under burst;
  # raises drop threshold before kernel softirq drains the queue.
  - { key: net.core.netdev_max_backlog, value: 16384 }

  # fix crowdsec container dns resolution
  - { key: net.ipv4.ip_forward, value: 1 }

  # Black-hole MTU detection. Recovers when path MTU shrinks (common with VPN/PPPoE
  # tunnels mid-route). Without it, large segments silently drop. Default 0 = off.
  - { key: net.ipv4.tcp_mtu_probing, value: 1 }

  # Cap unsent bytes in send buffer at 128KB. Reduces head-of-line latency for HTTP/2
  # (high-priority frames jump ahead of bulk frames queued in kernel). Default
  # 4294967295 (uint32 max) = effectively disabled.
  - { key: net.ipv4.tcp_notsent_lowat, value: 131072 }

  # SYN backlog. Distro default 4096; raise to absorb sync-client bursts (opencloud).
  # Pairs with kernel net.core.somaxconn (already 32768 on this distro, untouched).
  - { key: net.ipv4.tcp_max_syn_backlog, value: 8192 }

  # UDP socket default buffers. HTTP/3 (QUIC) on Traefik benefits — QUIC has no
  # kernel-side congestion window like TCP, must absorb bursts in userspace via
  # large recv buffer. Distro default 131072 = too small for QUIC at scale.
  - { key: net.core.rmem_default, value: 2097152 }
  - { key: net.core.wmem_default, value: 2097152 }

  # Writeback tuning. Distro vm.dirty_ratio=60 lets 60% of RAM go dirty before kernel
  # forces sync flush — causes multi-second stalls on big rsync/opencloud uploads.
  # 10% caps the burst. dirty_background_ratio left untouched (distro=2 kicks
  # background flush earlier, which is good).
  # vm.swappiness intentionally not set — owned by geerlingguy.swap via inventory
  # var swap_swappiness.
  - { key: vm.dirty_ratio, value: 10 }

mayurifag_general_extra_packages:
  - apt-transport-https
  - aptitude
  - apt-utils
  - ca-certificates
  - cron
  - curl
  - git
  - htop
  - linux-headers-generic
  - linux-image-generic
  - logrotate
  - mc
  - mosh
  - ncdu
  - nethogs
  - rsyslog
  - software-properties-common
  - unattended-upgrades
  - unzip
  - wget
  - whois
  - zip
  - jq
