---
- name: Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd-resolved DNS settings
  ansible.builtin.copy:
    src: resolved-dns.conf
    dest: /etc/systemd/resolved.conf.d/dns.conf
    mode: "0644"
  notify: Restart systemd-resolved

- name: Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

- name: Symlink /etc/resolv.conf to systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
