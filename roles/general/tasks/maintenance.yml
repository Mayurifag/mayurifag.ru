---
- name: Ensure cron service is running and enabled
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: yes

- name: Check if docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_bin

- name: Schedule weekly docker cleanup
  ansible.builtin.cron:
    name: "Weekly docker cleanup"
    special_time: weekly
    job: >-
      docker system prune --all --force
      --filter "label!=keep"
      && docker volume prune --force --filter "label!=keep"
  when: docker_bin.stat.exists

- name: Check fstrim binary works
  ansible.builtin.command: fstrim --version
  changed_when: false

- name: Check fstrim timer exists
  ansible.builtin.stat:
    path: /lib/systemd/system/fstrim.timer
    get_checksum: false
    get_attributes: false
    get_mime: false
  register: fstrim_timer

- name: Require fstrim timer
  ansible.builtin.assert:
    that:
      - fstrim_timer.stat.exists
    fail_msg: fstrim.timer is missing

- name: Create systemd-journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd-journald max size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-journal-size.conf
    content: |
      [Journal]
      SystemMaxUse=100M
      MaxRetentionSec=1month
    mode: "0644"
  notify: Restart systemd-journald

- name: Ensure rsyslog is running (generates auth.log)
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: yes

- name: Allow dhclient to execute true under AppArmor
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.dhclient
    content: |
      /{,usr/}bin/true rix,
    mode: "0644"
  notify: Reload AppArmor
