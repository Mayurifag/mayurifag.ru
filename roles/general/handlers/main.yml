---
- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Update apt-cache
  ansible.builtin.apt:
    update_cache: yes

- name: Reload AppArmor
  ansible.builtin.systemd:
    name: apparmor
    state: reloaded
