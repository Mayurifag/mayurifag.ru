---
- name: Validate private homelab proxy settings
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
      - homelab_proxy_acme_email != 'change_this@gmail.com'
      - homelab_proxy_dns_api_token | length > 20
      - homelab_proxy_domain == 'home.' ~ homelab_proxy_zone
  no_log: true

- name: Validate native-auth OpenCode backend routes
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - item.key not in ['proxmox', 'ha', 'immich', 'qwen']
      - item.value is match('^http://([0-9]{1,3}\.){3}[0-9]{1,3}:49374$')
    fail_msg: OpenCode routes require a unique host label and a private peer HTTP URL on TCP 49374 without credentials.
  loop: "{{ homelab_proxy_opencode_backends | dict2items }}"

- name: Install and configure the private proxy
  ansible.builtin.import_tasks: install.yml

- name: Configure private HTTPS firewall access
  ansible.builtin.import_tasks: firewall.yml
  tags: homelab_monitoring

- name: Configure LAN access to HomeKit
  ansible.builtin.import_tasks: homekit.yml
  when: homelab_proxy_homekit_enabled | bool
  tags: homelab_homekit

- name: Point homelab wildcard DNS at the private VPN address
  community.general.cloudflare_dns:
    zone: "{{ homelab_proxy_zone }}"
    record: "*.home"
    type: A
    value: "{{ homelab_proxy_vpn_address }}"
    proxied: false
    api_token: "{{ homelab_proxy_dns_api_token }}"
    state: present
  delegate_to: localhost
  become: false
  no_log: true

- name: Verify all homelab HTTPS endpoints from the authorized client
  ansible.builtin.uri:
    url: "{{ item }}"
    use_proxy: false
    validate_certs: true
    status_code: 200
  loop: >-
    {{ ['https://proxmox.' ~ homelab_proxy_domain ~ '/',
        'https://ha.' ~ homelab_proxy_domain ~ '/manifest.json',
        'https://immich.' ~ homelab_proxy_domain ~ '/api/server/ping'] +
        (['https://qwen.' ~ homelab_proxy_domain ~ '/health'] if homelab_proxy_qwen_url else []) }}
  delegate_to: localhost
  become: false
  register: homelab_proxy_https_health
  until: homelab_proxy_https_health.status == 200
  retries: 36
  delay: 5

- name: Verify OpenCode APIs require native authentication over HTTPS
  ansible.builtin.uri:
    url: "https://{{ item.key }}.{{ homelab_proxy_domain }}/api/session"
    use_proxy: false
    validate_certs: true
    status_code: 401
  loop: "{{ homelab_proxy_opencode_backends | dict2items }}"
  delegate_to: localhost
  become: false
  register: homelab_proxy_opencode_auth
  until: homelab_proxy_opencode_auth.status == 401
  retries: 6
  delay: 5
