---
- name: Check the Proxmox node firewall file
  ansible.builtin.stat:
    path: "/etc/pve/nodes/{{ ansible_facts.hostname }}/host.fw"
  register: homelab_proxy_node_firewall

- name: Initialize missing node firewall through Proxmox
  ansible.builtin.command: "pvesh set {{ ('/nodes/' ~ ansible_facts.hostname ~ '/firewall/options') | quote }} --enable 1"
  when: not homelab_proxy_node_firewall.stat.exists
  changed_when: true

- name: Ensure the node firewall has a rules section
  ansible.builtin.lineinfile:
    path: "/etc/pve/nodes/{{ ansible_facts.hostname }}/host.fw"
    line: '[RULES]'
    unsafe_writes: true

- name: Allow private HTTPS and LAN DNS through the Proxmox node firewall
  ansible.builtin.blockinfile:
    path: "/etc/pve/nodes/{{ ansible_facts.hostname }}/host.fw"
    insertafter: '^\[RULES\]$'
    marker: '# {mark} ANSIBLE HOMELAB HTTPS'
    block: |
      {% for network in homelab_proxy_allowed_networks %}
      IN ACCEPT -source {{ network }} -p tcp -dport 443
      {% endfor %}
      IN ACCEPT -i {{ homelab_proxy_lan_interface }} -source {{ homelab_proxy_homekit_lan_network }} -p udp -dport 53
      IN ACCEPT -i {{ homelab_proxy_lan_interface }} -source {{ homelab_proxy_homekit_lan_network }} -p tcp -dport 53
    unsafe_writes: true

- name: Validate Proxmox firewall configuration
  ansible.builtin.command: pve-firewall compile
  changed_when: false

- name: Remove persistent legacy Proxmox HTTPS redirect
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    regexp: '^\s+post-(up|down) .*--dport 443 -j REDIRECT --to-ports 8006.*$'
    state: absent
    backup: true

- name: Remove active legacy Proxmox HTTPS redirect
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    in_interface: "{{ homelab_proxy_lan_interface }}"
    protocol: tcp
    destination_port: "443"
    jump: REDIRECT
    to_ports: "8006"
    state: absent
