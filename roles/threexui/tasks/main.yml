---
# - name: Stop 3x-ui container if it exists
#   community.docker.docker_container:
#     name: 3x-ui
#     state: stopped

# - name: Remove traefik-certs-dumper if it exists
#   community.docker.docker_container:
#     name: 3x-traefik-certs-dumper
#     state: absent

# - name: Remove dumped certs
#   ansible.builtin.file:
#     path: "{{ threexui_certs_dumped_directory }}"
#     state: absent

- name: Create 3x-ui Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ threexui_data_directory }}/db"
    - "{{ threexui_certs_dumped_directory }}"

- name: Traefik Certs Dumper Sidecar
  community.docker.docker_container:
    name: 3x-traefik-certs-dumper
    image: "{{ threexui_certs_dumper_image }}"
    recreate: true
    restart_policy: unless-stopped
    memory: "{{ threexui_certs_dumper_memory }}"
    command: >-
      file --version v3 --watch --source /acme.json --dest /dump --crt-ext=.crt
      --key-ext=.key
    volumes:
      - "{{ traefik_data_directory }}/letsencrypt/acme.json:/acme.json:ro"
      - "{{ threexui_certs_dumped_directory }}:/dump:rw"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

- name: Create 3x-ui IPv6 Egress Network
  community.docker.docker_network:
    name: "{{ threexui_v6_egress_network_name }}"
    enable_ipv6: true
    state: present

- name: 3x-ui Docker Container
  community.docker.docker_container:
    name: 3x-ui
    image: "{{ threexui_docker_image }}"
    recreate: true
    volumes:
      - "{{ threexui_data_directory }}/db:/etc/x-ui:rw"
      - "{{ threexui_certs_dumped_directory }}:/root/cert:ro"
    ports:
      - "{{ threexui_hysteria2_port }}:{{ threexui_hysteria2_port }}/udp"
    env:
      XUI_ENABLE_FAIL2BAN: "{{ threexui_enable_fail2ban }}"
    restart_policy: unless-stopped
    networks:
      - name: "web"
      - name: "{{ threexui_v6_egress_network_name }}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"

      # Web Panel
      traefik.http.routers.threexui-panel.rule: "Host(`{{ threexui_panel_subdomain }}.{{ server_hostname }}`)"
      traefik.http.routers.threexui-panel.service: "threexui-panel"
      traefik.http.services.threexui-panel.loadbalancer.server.port: "2053"
      traefik.http.routers.threexui-panel.priority: "1"

      # Noisy dashboard polling endpoints
      traefik.http.routers.threexui-panel-polling.rule: "Host(`{{ threexui_panel_subdomain }}.{{ server_hostname }}`) && ({{ threexui_panel_polling_accesslog_excluded_ips | map('regex_replace', '^(.*)$', 'ClientIP(`\\1`)') | join(' || ') }}) && (Path(`/panel/api/server/status`) || Path(`/panel/api/inbounds/list`) || Path(`/panel/api/clients/onlines`) || Path(`/panel/api/clients/lastOnline`))"
      traefik.http.routers.threexui-panel-polling.service: "threexui-panel"
      traefik.http.routers.threexui-panel-polling.priority: "20"
      traefik.http.routers.threexui-panel-polling.observability.accesslogs: "false"

      # Subscription on /sub/ path
      traefik.http.routers.threexui-sub.rule: "Host(`{{ threexui_panel_subdomain }}.{{
        server_hostname }}`) && PathPrefix(`/sub/`)"
      traefik.http.routers.threexui-sub.service: "threexui-subscription"
      traefik.http.services.threexui-subscription.loadbalancer.server.port: "2096"
      traefik.http.routers.threexui-sub.priority: "10"

      # Reality TCP
      traefik.tcp.routers.threexui-reality.rule: "HostSNI(`{{ threexui_reality_domain }}`)"
      traefik.tcp.routers.threexui-reality.tls.passthrough: "true"
      traefik.tcp.routers.threexui-reality.service: "threexui-reality"
      traefik.tcp.services.threexui-reality.loadbalancer.server.port: "443"

- name: 3x-ui Post-Install Info
  ansible.builtin.debug:
    msg:
      - "Panel URL: https://{{ threexui_panel_subdomain }}.{{ server_hostname }}"
      - "Default creds: admin / admin"
      - "Subscription Reverse Proxy URI: https://{{ threexui_panel_subdomain
        }}.{{ server_hostname }}/sub/"
      - "VLESS Reality | port 443/tcp | SNI/target {{ threexui_reality_domain }}
        | flow xtls-rprx-vision | XHTTP"
      - "Hysteria2 | port {{ threexui_hysteria2_port }}/udp | SNI {{
        server_hostname }}"
      - "Hysteria2 cert: /root/cert/certs/{{ server_hostname }}.crt"
      - "Hysteria2 key:  /root/cert/private/{{ server_hostname }}.key"
      - "Hysteria2 masquerade URL: https://{{ server_hostname }}"
      - "Verify certs: docker exec 3x-ui ls /root/cert/certs /root/cert/private"
