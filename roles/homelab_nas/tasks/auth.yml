---
- name: Check the authenticated NAS Unix identity
  ansible.builtin.command:
    argv: [pct, exec, "{{ homelab_nas_ctid | string }}", --, getent, passwd, "{{ homelab_nas_authenticated_user }}"]
  register: homelab_nas_authenticated_identity
  changed_when: false
  failed_when: homelab_nas_authenticated_identity.rc not in [0, 2]
  check_mode: false

- name: Refuse to adopt a login-capable or non-system identity
  ansible.builtin.assert:
    that:
      - >-
        homelab_nas_authenticated_identity.rc != 0 or
        (homelab_nas_authenticated_identity.stdout.split(':')[2] | int < 1000 and
        homelab_nas_authenticated_identity.stdout.split(':')[6] == '/usr/sbin/nologin')

- name: Create the non-login authenticated NAS identity
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ homelab_nas_ctid | string }}"
      - --
      - useradd
      - --system
      - --user-group
      - --no-create-home
      - --shell
      - /usr/sbin/nologin
      - "{{ homelab_nas_authenticated_user }}"
  when: homelab_nas_authenticated_identity.rc != 0
  changed_when: true

- name: Check the authenticated Samba account
  ansible.builtin.command:
    argv: [pct, exec, "{{ homelab_nas_ctid | string }}", --, pdbedit, -L]
  register: homelab_nas_samba_identities
  changed_when: false
  check_mode: false

- name: Create a new authenticated Samba account
  when: >-
    homelab_nas_samba_identities.stdout_lines
    | select('match', '^' ~ (homelab_nas_authenticated_user | regex_escape) ~ ':') | list | length == 0
  block:
    - name: Require a secure credential source for a new Samba account
      ansible.builtin.assert:
        that:
          - homelab_nas_password_command | default('') | length > 0
        fail_msg: Supply homelab_nas_password_command to read the NAS password without exposing it in arguments.

    - name: Read the new Samba password on the controller
      ansible.builtin.set_fact:
        # The sentinel prevents the pipe lookup from stripping password whitespace.
        homelab_nas_smb_password: >-
          {{ lookup('ansible.builtin.pipe', 'sh -c ' ~ (homelab_nas_password_command | quote) ~ ' && printf .')[:-1] }}
        cacheable: false
      no_log: true

    - name: Require a long, single-line password that fits smbpasswd
      ansible.builtin.assert:
        that:
          - homelab_nas_smb_password | length >= 24
          - homelab_nas_smb_password.encode('utf-8') | length <= 254
          - "'\\n' not in homelab_nas_smb_password"
          - "'\\r' not in homelab_nas_smb_password"
          - "'\\x00' not in homelab_nas_smb_password"
      no_log: true

    - name: Create the authenticated Samba account
      ansible.builtin.command:
        argv: [pct, exec, "{{ homelab_nas_ctid | string }}", --, smbpasswd, -s, -a, "{{ homelab_nas_authenticated_user }}"]
        stdin: "{{ homelab_nas_smb_password }}\n{{ homelab_nas_smb_password }}"
      changed_when: true
      no_log: true
