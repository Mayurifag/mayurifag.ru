---
traefik_enabled: true

traefik_docker_image: traefik:v3.7.1
traefik_log_level: "INFO"
traefik_subdomain: "traefik"

# find the relevant name and environment variables for your DNS provider at https://go-acme.github.io/lego/dns/
traefik_dns_provider: cloudflare
traefik_environment_variables:
  CF_DNS_API_TOKEN: "change_this"

# requests a wildcard certificate for your domain, so there should be no reason to have to use the staging
# letsencrypt acme server. If you do want to flip between staging/production, you might need to stop Traefik and clear
# the "{{ docker_home }}/traefik" after changing this setting.
traefik_acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory" # staging
# traefik_acme_server: "https://acme-v02.api.letsencrypt.org/directory" # production

# specs
traefik_memory: 1g

###
### Cloudflare DNS / Email Routing (managed by this role, tag: dns)
###
# Catch-all forwards every *@{{ server_hostname }} to admin_email.
# MX + DKIM records: managed by CF Email Routing (not by this role).
# SPF / DMARC: managed here with a strict no-outbound posture —
#   SPF allows only CF Routing forwards (-all hard-fails everything else),
#   DMARC enforces p=reject + sp=reject with strict alignment.
# DMARC TXT is patched in place so the rua UUID generated by CF DMARC
# Management is preserved (reports keep flowing into the CF dashboard).
# On a brand-new zone, click "Enable" once at
# https://dash.cloudflare.com/<acct>/<zone>/email/dmarc-management;
# subsequent runs flip p=none -> p=reject and add strict alignment.

###
### CrowdSec (bundled with Traefik)
###

crowdsec_data_directory: "{{ docker_home }}/crowdsec/data"
crowdsec_config_directory: "{{ docker_home }}/crowdsec/config"

crowdsec_image: crowdsecurity/crowdsec:v1.7.7
crowdsec_bouncer_plugin_module: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
crowdsec_bouncer_plugin_version: "v1.6.0"

# Ban duration (1 year)
crowdsec_ban_duration: "8760h"

# CrowdSec Console Enrollment
crowdsec_enroll_key: "change_me"
crowdsec_instance_name: "{{ server_hostname }}"
crowdsec_enroll_tags:
  - "{{ server_hostname }}"

# Whitelist these IPs/CIDRs from CrowdSec decisions (lockout protection)
crowdsec_whitelist_ips: []
crowdsec_whitelist_inventory_hosts: true

# Auto-detect the active SSH client IPv4 and whitelist its /32
crowdsec_whitelist_operator_ip: true

crowdsec_collections:
  - crowdsecurity/traefik
  - crowdsecurity/http-cve
  - crowdsecurity/sshd
  - crowdsecurity/linux
  - crowdsecurity/appsec-generic-rules
  - crowdsecurity/appsec-virtual-patching

crowdsec_firewall_sync_enabled: true
crowdsec_firewall_bouncer_key_path: "{{ crowdsec_data_directory }}/.firewall_bouncer_key"
