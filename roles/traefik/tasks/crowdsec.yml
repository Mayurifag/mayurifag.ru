---
- name: Get admin user info
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin_username }}"

- name: Create CrowdSec Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ crowdsec_data_directory }}"
    - "{{ crowdsec_config_directory }}"
    - "{{ crowdsec_config_directory }}/parsers/s02-enrich"

- name: Create acquisition config
  ansible.builtin.template:
    src: crowdsec/acquis.yaml.j2
    dest: "{{ crowdsec_config_directory }}/acquis.yaml"
    mode: "0644"
  register: crowdsec_acquis_template

- name: Create profiles config
  ansible.builtin.template:
    src: crowdsec/profiles.yaml.j2
    dest: "{{ crowdsec_config_directory }}/profiles.yaml"
    mode: "0644"
  register: crowdsec_profiles_template

- name: Detect operator SSH client IPv4
  ansible.builtin.command: sh -c 'printf "%s" "${SSH_CLIENT%% *}"'
  become: false
  run_once: true
  register: operator_ssh_client_ip
  changed_when: false
  failed_when: false
  when: crowdsec_whitelist_operator_ip

- name: Compute inventory server whitelist
  ansible.builtin.set_fact:
    crowdsec_inventory_whitelist: >-
      {{ groups['sample'] | default([])
        | map('extract', hostvars, 'ansible_host')
        | select('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}$')
        | map('regex_replace', '$', '/32')
        | list }}
  when: crowdsec_whitelist_inventory_hosts

- name: Compute effective CrowdSec whitelist
  ansible.builtin.set_fact:
    crowdsec_effective_whitelist: >-
      {{ (crowdsec_whitelist_ips
        + (crowdsec_inventory_whitelist | default([]))
        + ([operator_ssh_client_ip.stdout ~ '/32']
          if (crowdsec_whitelist_operator_ip
              and (operator_ssh_client_ip.stdout | default('')) is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))
          else [])) | unique | list }}

- name: Deploy CrowdSec whitelist
  ansible.builtin.template:
    src: crowdsec/whitelists.yaml.j2
    dest: "{{ crowdsec_config_directory }}/parsers/s02-enrich/whitelists.yaml"
    mode: "0644"
  register: crowdsec_whitelist_template

- name: Configure CrowdSec local config override
  ansible.builtin.template:
    src: crowdsec/config.yaml.local.j2
    dest: "{{ crowdsec_config_directory }}/config.yaml.local"
    mode: "0644"
  register: crowdsec_config_local_template

- name: Configure CrowdSec local API credentials override
  ansible.builtin.template:
    src: crowdsec/local_api_credentials.yaml.local.j2
    dest: "{{ crowdsec_config_directory }}/local_api_credentials.yaml.local"
    mode: "0600"
  register: crowdsec_local_api_credentials_local_template

- name: Ensure auth.log exists
  ansible.builtin.file:
    path: /var/log/auth.log
    state: touch
    mode: "0640"
  changed_when: false

- name: CrowdSec Docker Container
  community.docker.docker_container:
    name: crowdsec
    image: "{{ crowdsec_image }}"
    pull: true
    recreate: >-
      {{ crowdsec_acquis_template.changed or
        crowdsec_profiles_template.changed or
        crowdsec_whitelist_template.changed or
        crowdsec_config_local_template.changed or
        crowdsec_local_api_credentials_local_template.changed }}
    restart_policy: unless-stopped
    networks:
      - name: "web"
    volumes:
      - "{{ crowdsec_data_directory }}:/var/lib/crowdsec/data"
      - "{{ crowdsec_config_directory }}:/etc/crowdsec"
      - "/var/log/auth.log:/var/log/auth.log:ro"
      - "{{ traefik_logs_directory }}:/var/log/traefik:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "127.0.0.1:8080:8080"
    env:
      COLLECTIONS: "{{ crowdsec_collections | join(' ') }}"
      SCENARIOS: "{{ crowdsec_scenarios | join(' ') }}"
      GID: "{{ ansible_facts.getent_passwd[admin_username][2] }}"
      UID: "{{ ansible_facts.getent_passwd[admin_username][1] }}"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

- name: Wait for CrowdSec LAPI to be ready
  ansible.builtin.command: docker exec crowdsec cscli lapi status
  register: crowdsec_lapi_status
  until: crowdsec_lapi_status.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: List existing bouncers
  ansible.builtin.command: docker exec crowdsec cscli bouncers list -o json
  register: crowdsec_bouncers_list
  changed_when: false

- name: Check persisted bouncer key
  ansible.builtin.stat:
    path: "{{ crowdsec_data_directory }}/.bouncer_key"
  register: bouncer_key_file

- name: Compute Traefik bouncer state
  ansible.builtin.set_fact:
    traefik_bouncer_records: >-
      {{ crowdsec_bouncers_list.stdout | from_json |
        selectattr('name', 'equalto', 'traefik-bouncer') | list }}
    traefik_bouncer_names: >-
      {{ crowdsec_bouncers_list.stdout | from_json | map(attribute='name') |
        select('match', '^traefik-bouncer(@.*)?$') | list }}

- name: Select active Traefik bouncer record
  ansible.builtin.set_fact:
    traefik_bouncer_current: "{{ traefik_bouncer_records | first | default({}) }}"

- name: Compute active Traefik bouncer status
  ansible.builtin.set_fact:
    traefik_bouncer_healthy: >-
      {{ (traefik_bouncer_records | length) == 1
        and not (traefik_bouncer_current.revoked | default(true) | bool)
        and (traefik_bouncer_current.last_pull | default('', true) | length) > 0 }}

- name: Provision Traefik bouncer
  when: >-
    not bouncer_key_file.stat.exists or not traefik_bouncer_healthy or
    (traefik_bouncer_names | difference(['traefik-bouncer']) | length) > 0
  block:
    - name: Delete existing Traefik bouncers
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - crowdsec
          - cscli
          - bouncers
          - delete
          - "{{ item }}"
      loop: "{{ traefik_bouncer_names }}"
      loop_control:
        label: "{{ item }}"
      register: bouncer_delete
      failed_when:
        - bouncer_delete.rc != 0
        - "'unable to find' not in bouncer_delete.stderr"
        - "'does not exist' not in bouncer_delete.stderr"
        - "'not found' not in bouncer_delete.stderr"
      changed_when: bouncer_delete.rc == 0

    - name: Create Traefik Bouncer
      ansible.builtin.command: docker exec crowdsec cscli bouncers add traefik-bouncer -o raw
      register: bouncer_create_out

    - name: Persist bouncer key
      ansible.builtin.copy:
        content: "{{ bouncer_create_out.stdout }}"
        dest: "{{ crowdsec_data_directory }}/.bouncer_key"
        mode: "0600"

- name: Read persisted bouncer key
  ansible.builtin.slurp:
    src: "{{ crowdsec_data_directory }}/.bouncer_key"
  register: bouncer_key_slurp

- name: Configure CrowdSec Middleware for Traefik
  ansible.builtin.template:
    src: crowdsec/traefik_crowdsec.toml.j2
    dest: "{{ traefik_dynamic_configs_directory }}/crowdsec.toml"
    mode: "0644"
  register: crowdsec_traefik_middleware_config
  vars:
    crowdsec_api_key: "{{ bouncer_key_slurp.content | b64decode | trim }}"

- name: Add CrowdSec apt key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    mode: "0644"
  when: crowdsec_firewall_sync_enabled

- name: Remove legacy CrowdSec apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    state: absent
  register: crowdsec_legacy_apt_repository
  when: crowdsec_firewall_sync_enabled

- name: Add CrowdSec apt repository
  ansible.builtin.deb822_repository:
    name: crowdsec_crowdsec
    types:
      - deb
    uris:
      - https://packagecloud.io/crowdsec/crowdsec/any
    suites:
      - any
    components:
      - main
    signed_by: /etc/apt/keyrings/crowdsec.asc
    state: present
    install_python_debian: true
  register: crowdsec_apt_repository
  when: crowdsec_firewall_sync_enabled

- name: Update apt-cache after CrowdSec repository changes
  ansible.builtin.apt:
    update_cache: true
  when:
    - crowdsec_firewall_sync_enabled
    - crowdsec_apt_repository.changed or crowdsec_legacy_apt_repository.changed

- name: Install CrowdSec firewall bouncer
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: present
  when: crowdsec_firewall_sync_enabled

- name: Check persisted firewall bouncer key
  ansible.builtin.stat:
    path: "{{ crowdsec_firewall_bouncer_key_path }}"
  register: firewall_bouncer_key_file
  when: crowdsec_firewall_sync_enabled

- name: Compute firewall bouncer state
  ansible.builtin.set_fact:
    firewall_bouncer_names: >-
      {{ crowdsec_bouncers_list.stdout | from_json | map(attribute='name') |
        select('match', '^firewall-bouncer(@.*)?$') | list }}
  when: crowdsec_firewall_sync_enabled

- name: Provision firewall bouncer
  when:
    - crowdsec_firewall_sync_enabled
    - >-
      not firewall_bouncer_key_file.stat.exists or
      'firewall-bouncer' not in firewall_bouncer_names or
      (firewall_bouncer_names | difference(['firewall-bouncer']) | length) > 0
  block:
    - name: Delete existing firewall bouncers
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - crowdsec
          - cscli
          - bouncers
          - delete
          - "{{ item }}"
      loop: "{{ firewall_bouncer_names }}"
      loop_control:
        label: "{{ item }}"
      register: firewall_bouncer_delete
      failed_when:
        - firewall_bouncer_delete.rc != 0
        - "'unable to find' not in firewall_bouncer_delete.stderr"
        - "'does not exist' not in firewall_bouncer_delete.stderr"
        - "'not found' not in firewall_bouncer_delete.stderr"
      changed_when: firewall_bouncer_delete.rc == 0

    - name: Create firewall bouncer key
      ansible.builtin.command: docker exec crowdsec cscli bouncers add firewall-bouncer -o raw
      register: firewall_bouncer_create_out

    - name: Persist firewall bouncer key
      ansible.builtin.copy:
        content: "{{ firewall_bouncer_create_out.stdout }}"
        dest: "{{ crowdsec_firewall_bouncer_key_path }}"
        mode: "0600"

- name: Read persisted firewall bouncer key
  ansible.builtin.slurp:
    src: "{{ crowdsec_firewall_bouncer_key_path }}"
  register: firewall_bouncer_key_slurp
  when: crowdsec_firewall_sync_enabled

- name: Configure CrowdSec firewall bouncer
  ansible.builtin.template:
    src: crowdsec/crowdsec-firewall-bouncer.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    mode: "0600"
  register: firewall_bouncer_config
  vars:
    firewall_bouncer_api_key: "{{ firewall_bouncer_key_slurp.content | b64decode | trim }}"
  when: crowdsec_firewall_sync_enabled

- name: Create CrowdSec firewall bouncer systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service.d
    state: directory
    mode: "0755"
  when: crowdsec_firewall_sync_enabled

- name: Configure CrowdSec firewall bouncer startup ordering
  ansible.builtin.copy:
    dest: /etc/systemd/system/crowdsec-firewall-bouncer.service.d/override.conf
    content: |
      [Unit]
      After=docker.service
      Requires=docker.service

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do curl -sS -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 2; done; exit 1'
    mode: "0644"
  register: firewall_bouncer_systemd_override
  when: crowdsec_firewall_sync_enabled

- name: Enable CrowdSec firewall bouncer
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    enabled: true
    daemon_reload: "{{ firewall_bouncer_systemd_override.changed }}"
    state: "{{ 'restarted' if firewall_bouncer_config.changed else 'started' }}"
  when: crowdsec_firewall_sync_enabled

- name: Schedule CrowdSec hub update, upgrade and reload
  ansible.builtin.cron:
    name: "CrowdSec hub update and upgrade"
    minute: "0"
    hour: "4"
    job: >-
      (docker exec crowdsec cscli hub update && docker exec crowdsec cscli hub
      upgrade && docker restart crowdsec) >> /var/log/crowdsec-hub-upgrade.log
      2>&1

- name: Determine if console enrollment configured
  ansible.builtin.set_fact:
    crowdsec_enroll_configured: >-
      {{ crowdsec_enroll_key is defined
        and crowdsec_enroll_key != "change_me"
        and crowdsec_enroll_key | length > 0 }}

- name: Check enrollment marker
  ansible.builtin.stat:
    path: "{{ crowdsec_data_directory }}/.console_enrolled"
  register: crowdsec_enroll_marker

- name: Read enrollment marker
  ansible.builtin.slurp:
    src: "{{ crowdsec_data_directory }}/.console_enrolled"
  register: crowdsec_enroll_marker_slurp
  when: crowdsec_enroll_marker.stat.exists

- name: Set already-enrolled flag
  ansible.builtin.set_fact:
    crowdsec_already_enrolled: >-
      {{ crowdsec_enroll_marker.stat.exists
        and (crowdsec_enroll_marker_slurp.content | default('') | b64decode | trim) == (crowdsec_enroll_key | default('') | trim) }}

- name: Enroll CrowdSec in Console
  when:
    - crowdsec_enroll_configured
    - not crowdsec_already_enrolled
  block:
    - name: Register CAPI credentials
      ansible.builtin.command: docker exec crowdsec cscli capi register
      register: capi_register
      failed_when:
        - capi_register.rc != 0
        - "'already' not in (capi_register.stderr ~ capi_register.stdout)"
      changed_when: capi_register.rc == 0

    - name: Enroll using provided key
      ansible.builtin.command:
        argv: >-
          {{ ['docker','exec','crowdsec','cscli','console','enroll','--name',
          crowdsec_instance_name]
            + ((['--tags'] * (crowdsec_enroll_tags | length)) | zip(crowdsec_enroll_tags) | map('list') | flatten | list)
            + [crowdsec_enroll_key] }}
      changed_when: true

    - name: Persist enrollment marker
      ansible.builtin.copy:
        content: "{{ crowdsec_enroll_key }}"
        dest: "{{ crowdsec_data_directory }}/.console_enrolled"
        mode: "0600"

    - name: Restart CrowdSec container after enrollment
      community.docker.docker_container:
        name: crowdsec
        restart: yes
        state: started

    - name: Wait for CrowdSec LAPI to be ready (after restart)
      ansible.builtin.command: docker exec crowdsec cscli lapi status
      register: crowdsec_lapi_status_after_enroll
      until: crowdsec_lapi_status_after_enroll.rc == 0
      retries: 30
      delay: 2
      changed_when: false

- name: Aggregate post-install message (CrowdSec enrollment)
  ansible.builtin.set_fact:
    post_install_messages: >-
      {{ (post_install_messages | default([])) +
        ['[CrowdSec] Enroll at https://app.crowdsec.net/security-engines as ' ~ crowdsec_instance_name] }}
  when:
    - crowdsec_enroll_configured
    - not crowdsec_already_enrolled
