---
- name: Inspect the Xiaomi Miot component directory
  ansible.builtin.stat:
    path: "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot"
  register: home_assistant_xiaomi_miot_directory

- name: Inspect the installed Xiaomi Miot revision marker
  ansible.builtin.stat:
    path: "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot/.ansible-revision"
  register: home_assistant_xiaomi_miot_stat

- name: Read the installed Xiaomi Miot revision
  ansible.builtin.slurp:
    src: "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot/.ansible-revision"
  register: home_assistant_xiaomi_miot_installed_revision
  when: home_assistant_xiaomi_miot_stat.stat.exists

- name: Deploy the pinned Xiaomi Miot revision
  when: >-
    not home_assistant_xiaomi_miot_stat.stat.exists or
    (home_assistant_xiaomi_miot_installed_revision.content | b64decode | trim) != home_assistant_xiaomi_miot_revision
  block:
    - name: Download the verified Xiaomi Miot archive
      ansible.builtin.get_url:
        url: "https://codeload.github.com/al-one/hass-xiaomi-miot/zip/{{ home_assistant_xiaomi_miot_revision }}"
        dest: "/tmp/xiaomi_miot-{{ home_assistant_xiaomi_miot_revision }}.zip"
        checksum: "{{ home_assistant_xiaomi_miot_checksum }}"
        mode: "0600"

    - name: Back up Home Assistant before changing Xiaomi Miot
      ansible.builtin.command:
        argv:
          - ha
          - backups
          - new
          - --name
          - "Before Xiaomi Miot {{ home_assistant_xiaomi_miot_revision[:7] }}"
      changed_when: true

    - name: Create the custom component directory
      ansible.builtin.file:
        path: "{{ home_assistant_config_directory }}/custom_components"
        state: directory
        mode: "0755"

    - name: Stage Xiaomi Miot on the configuration filesystem
      ansible.builtin.tempfile:
        state: directory
        path: "{{ home_assistant_config_directory }}/custom_components"
        prefix: .xiaomi_miot-
      register: home_assistant_xiaomi_miot_stage

    - name: Extract Xiaomi Miot with the SSH app's BusyBox unzip
      # The unarchive module requires zipinfo, which the SSH app does not provide.
      ansible.builtin.command:
        argv:
          - unzip
          - -oq
          - "/tmp/xiaomi_miot-{{ home_assistant_xiaomi_miot_revision }}.zip"
          - -d
          - "{{ home_assistant_xiaomi_miot_stage.path }}/new"
      changed_when: true

    - name: Record the staged Xiaomi Miot revision
      ansible.builtin.copy:
        content: "{{ home_assistant_xiaomi_miot_revision }}\n"
        dest: "{{ home_assistant_xiaomi_miot_stage.path }}/new/hass-xiaomi-miot-{{ home_assistant_xiaomi_miot_revision }}/custom_components/xiaomi_miot/.ansible-revision"
        mode: "0644"

    - name: Preserve the previous Xiaomi Miot component
      ansible.builtin.command:
        argv:
          - mv
          - "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot"
          - "{{ home_assistant_xiaomi_miot_stage.path }}/previous"
      when: home_assistant_xiaomi_miot_directory.stat.exists
      changed_when: true
      register: home_assistant_xiaomi_miot_previous

    - name: Activate the staged Xiaomi Miot component
      ansible.builtin.command:
        argv:
          - mv
          - "{{ home_assistant_xiaomi_miot_stage.path }}/new/hass-xiaomi-miot-{{ home_assistant_xiaomi_miot_revision }}/custom_components/xiaomi_miot"
          - "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot"
      changed_when: true
      register: home_assistant_xiaomi_miot_activation

    - name: Validate Home Assistant with Xiaomi Miot installed
      ansible.builtin.command: ha core check
      changed_when: false

    - name: Restart Home Assistant to discover Xiaomi Miot
      ansible.builtin.command: ha core restart
      changed_when: true
      register: home_assistant_xiaomi_miot_restart

    - name: Wait for Home Assistant after installing Xiaomi Miot
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:80/manifest.json"
        use_proxy: false
        status_code: 200
      register: home_assistant_xiaomi_miot_health
      until: home_assistant_xiaomi_miot_health.status == 200
      retries: 60
      delay: 2

  rescue:
    - name: Roll back a changed Xiaomi Miot component
      when: >-
        (home_assistant_xiaomi_miot_previous is defined and home_assistant_xiaomi_miot_previous.changed and not home_assistant_xiaomi_miot_previous.failed) or
        (home_assistant_xiaomi_miot_activation is defined and home_assistant_xiaomi_miot_activation.changed and not home_assistant_xiaomi_miot_activation.failed)
      block:
        - name: Remove the failed Xiaomi Miot component
          ansible.builtin.file:
            path: "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot"
            state: absent

        - name: Restore the previous Xiaomi Miot component
          ansible.builtin.command:
            argv:
              - mv
              - "{{ home_assistant_xiaomi_miot_stage.path }}/previous"
              - "{{ home_assistant_config_directory }}/custom_components/xiaomi_miot"
          when: home_assistant_xiaomi_miot_directory.stat.exists
          changed_when: true

        - name: Restart Home Assistant after Xiaomi Miot rollback
          ansible.builtin.command: ha core restart
          changed_when: true
          when: home_assistant_xiaomi_miot_restart is defined

    - name: Remove the rolled-back Xiaomi Miot staging directory
      ansible.builtin.file:
        path: "{{ home_assistant_xiaomi_miot_stage.path }}"
        state: absent
      when: home_assistant_xiaomi_miot_stage.path is defined

    - name: Report the failed Xiaomi Miot installation
      ansible.builtin.fail:
        msg: "Xiaomi Miot installation failed; the previous component state was restored."
  always:
    - name: Remove the downloaded Xiaomi Miot archive
      ansible.builtin.file:
        path: "/tmp/xiaomi_miot-{{ home_assistant_xiaomi_miot_revision }}.zip"
        state: absent

- name: Remove the successful Xiaomi Miot staging directory
  ansible.builtin.file:
    path: "{{ home_assistant_xiaomi_miot_stage.path }}"
    state: absent
  when: home_assistant_xiaomi_miot_stage.path is defined
