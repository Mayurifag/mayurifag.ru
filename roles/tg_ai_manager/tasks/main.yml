---
- name: Create tg-ai-manager Directory
  ansible.builtin.file:
    path: "{{ tg_ai_manager_data_directory }}"
    state: directory
    mode: "0755"

- name: Start tg-ai-manager Docker Container
  community.docker.docker_container:
    name: tg-ai-manager
    image: "{{ tg_ai_manager_image }}"
    pull: true
    recreate: true
    restart_policy: unless-stopped
    memory: "{{ tg_ai_manager_memory }}"
    volumes:
      - "{{ tg_ai_manager_data_directory }}:/app_data"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    env:
      TG_API_ID: "{{ tg_ai_manager_api_id }}"
      TG_API_HASH: "{{ tg_ai_manager_api_hash }}"
    networks:
      - name: "web"
    labels:
      traefik.enable: "true"
      traefik.http.routers.tg_ai_manager.rule: "Host(`{{ tg_ai_manager_subdomain }}.{{ server_hostname }}`)"
      traefik.http.services.tg_ai_manager.loadbalancer.server.port: "8000"
      traefik.http.routers.tg_ai_manager.middlewares: "tinyauth@docker"
      traefik.http.routers.tg_ai_manager_public.rule: "Host(`{{ tg_ai_manager_subdomain }}.{{ server_hostname }}`) && Path(`/api/rules/export`)"
      traefik.http.routers.tg_ai_manager_public.service: "tg_ai_manager"
      com.centurylinklabs.watchtower.enable: "true"
  no_log: true
