---
- name: Stop advertising a DNS search suffix without changing DNS forwarding
  ansible.builtin.raw: |
    set -eu
    changed=0
    for option in domain local; do
      if uci -q get "dhcp.@dnsmasq[0].$option" >/dev/null; then
        uci -q delete "dhcp.@dnsmasq[0].$option"
        changed=1
      fi
    done
    if [ "$(uci -q get 'dhcp.@dnsmasq[0].expandhosts')" != 0 ]; then
      uci set 'dhcp.@dnsmasq[0].expandhosts=0'
      changed=1
    fi
    if [ "$changed" = 1 ]; then
      uci commit dhcp
      /etc/init.d/dnsmasq restart
      echo dns-settings-changed
    fi
  register: homelab_dns_router
  changed_when: "'dns-settings-changed' in homelab_dns_router.stdout"

- name: Validate the LAN web shortcut DNS target and labels
  ansible.builtin.assert:
    that:
      - homelab_dns_shortcut_proxy.homelab_proxy_lan_address is defined
      - homelab_dns_shortcut_proxy.homelab_proxy_lan_address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - item is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - item not in ['nas', 'nas-private']
  loop: "{{ homelab_dns_shortcut_labels }}"
  when:
    - groups.get('homelab', []) | length == 1
    - homelab_dns_shortcut_proxy.homelab_proxy_enabled | default(false) | bool
  tags: homelab_shortcuts

- name: Configure DNS records for enabled LAN web shortcuts
  ansible.builtin.raw: |
    set -eu
    changed=0
    {% for label in homelab_dns_shortcut_labels %}
    section=homelab_web_{{ label | replace('-', '_') }}
    section_type=$(uci -q get "dhcp.$section" || true)
    if [ -n "$section_type" ] && [ "$section_type" != domain ]; then
      echo "Conflicting router DNS section: $section" >&2
      exit 1
    fi
    {% endfor %}
    for section in $(uci -q show dhcp | sed -n 's/^dhcp\.\(homelab_web_[a-z0-9_]*\)=domain$/\1/p'); do
      case ' {{ homelab_dns_shortcut_labels | map('replace', '-', '_') | join(' ') }} ' in
        *" ${section#homelab_web_} "*) ;;
        *) uci delete "dhcp.$section"; changed=1 ;;
      esac
    done
    {% for label in homelab_dns_shortcut_labels %}
    section=homelab_web_{{ label | replace('-', '_') }}
    if [ "$(uci -q get "dhcp.$section" || true)" != domain ]; then
      uci set "dhcp.$section=domain"
      changed=1
    fi
    if [ "$(uci -q get "dhcp.$section.name" || true)" != {{ (label ~ '.test') | quote }} ]; then
      uci set "dhcp.$section.name={{ label }}.test"
      changed=1
    fi
    if [ "$(uci -q get "dhcp.$section.ip" || true)" != {{ homelab_dns_shortcut_proxy.homelab_proxy_lan_address | quote }} ]; then
      uci set "dhcp.$section.ip={{ homelab_dns_shortcut_proxy.homelab_proxy_lan_address }}"
      changed=1
    fi
    {% endfor %}
    if [ "$changed" = 1 ]; then
      uci commit dhcp
      /etc/init.d/dnsmasq reload
      echo homelab-shortcut-dns-changed
    fi
  register: homelab_dns_shortcut_router
  changed_when: "'homelab-shortcut-dns-changed' in homelab_dns_shortcut_router.stdout"
  when:
    - groups.get('homelab', []) | length == 1
    - homelab_dns_shortcut_proxy.homelab_proxy_enabled | default(false) | bool
  tags: homelab_shortcuts
