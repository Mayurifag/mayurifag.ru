---
- name: Make sure we have a 'wheel' group
  ansible.builtin.group:
    name: wheel
    state: present

- name: Allow 'wheel' group to have passwordless sudo
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^%wheel"
    line: "%wheel ALL=(ALL) NOPASSWD: ALL"
    validate: "visudo -cf %s"

- name: Add admin user with wheel group
  ansible.builtin.user:
    name: "{{ admin_username }}"
    groups: wheel
    append: yes
    state: present
    createhome: yes
    shell: /bin/bash

- name: Set admin user password
  ansible.builtin.command: 'echo "{{ admin_username }}:{{ admin_userpassword }}" | chpasswd'

- name: Set root password
  ansible.builtin.command: 'echo "root:{{ root_userpassword }}" | chpasswd'

- name: Create user .ssh directory
  ansible.builtin.file:
    path: "~{{ admin_username }}/.ssh"
    mode: "0700"
    state: directory
    owner: "{{ admin_username }}"

- name: Read server peer SSH key
  ansible.builtin.set_fact:
    ssh_server_peer_private_key: "{{ lookup('ansible.builtin.file', ssh_server_peer_key_path, errors='ignore') | trim }}"
    ssh_server_peer_public_key: "{{ lookup('ansible.builtin.file', ssh_server_peer_key_path ~ '.pub', errors='ignore') | trim }}"
  no_log: true

- name: Install server peer SSH private key
  ansible.builtin.copy:
    content: "{{ ssh_server_peer_private_key }}\n"
    dest: "~{{ admin_username }}/.ssh/id_ed25519"
    owner: "{{ admin_username }}"
    mode: "0600"
  no_log: true
  when: ssh_server_peer_private_key | length > 0

- name: Install server peer SSH public key
  ansible.builtin.copy:
    content: "{{ ssh_server_peer_public_key }}\n"
    dest: "~{{ admin_username }}/.ssh/id_ed25519.pub"
    owner: "{{ admin_username }}"
    mode: "0644"
  when: ssh_server_peer_public_key | length > 0

- name: Create user authorized_keys
  ansible.builtin.template:
    src: "templates/authorized_keys.j2"
    dest: "~{{ admin_username }}/.ssh/authorized_keys"
    owner: "{{ admin_username }}"
    mode: "0400"

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SSH daemon settings in .d
  ansible.builtin.template:
    src: "templates/sshd_config.j2"
    dest: "/etc/ssh/sshd_config.d/10-ansible.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd
